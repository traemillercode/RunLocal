<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#14171C;color:#F7F7F5;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:72px 80px;position:relative;overflow:hidden}
/* The coral rail — the product's signature, same device as the board. */
.rail{position:absolute;left:0;top:0;bottom:0;width:16px;background:#FF5741}
.kicker{font-size:22px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#FF5741}
h1{font-size:82px;line-height:1.0;letter-spacing:-.035em;font-weight:800;max-width:15ch;margin-top:24px}
p{font-size:30px;line-height:1.35;color:#B5B7BB;max-width:30ch;margin-top:22px}
.foot{display:flex;align-items:center;gap:16px}
.mark{width:52px;height:52px;border-radius:14px;background:#FF5741;display:grid;place-items:center}
.wordmark{font-size:26px;font-weight:900;letter-spacing:.12em}
.wordmark span{color:#FF5741}
</style></head><body>
<div class="rail"></div>
<div>
  <div class="kicker">Columbia, MO</div>
  <h1>Every group run in Columbia</h1>
  <p>The pace, the meeting spot, and who's going. One place.</p>
</div>
<div class="foot">
  <div class="mark"><svg width="30" height="30" viewBox="0 0 64 64"><path d="M13 32.5 36 19m-18 29 31-18" fill="none" stroke="#14171C" stroke-width="8" stroke-linecap="round"/></svg></div>
  <div class="wordmark">KIM<span>BIO</span></div>
</div>
</body></html>
