<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kimbio — Columbia, MO</title>
    <meta
      name="description"
      content="Kimbio helps you find group runs, races, and running community in your city. Launching with Columbia, MO."
    />
    <meta name="theme-color" content="#14171C" />
    <!--
      Canonical host. Three hostnames served identical content (Railway service
      domain, apex, www); the server now 301s the other two here, and this tag
      is the belt-and-braces signal for anything that reaches a non-canonical
      origin before the redirect (a cached page, a scraper that ignores 301s).

      Deliberately site-root and static: a SPA has no per-route head management
      yet, and a canonical tag pointing every route at "/" would be actively
      worse than none. Per-route canonicals land with the prerendering work in
      roadmap 2.12, which is where per-route <title> and OG tags belong too.
    -->
    <link rel="canonical" href="https://getkimbio.com/" />

    <!--
      OPEN GRAPH / TWITTER CARDS.

      There were NONE, so a texted invite link had nothing to render: iMessage,
      WhatsApp and Slack fall back to scraping the page, hit an empty
      <div id="root"> because there is no prerendering yet, and show a bare grey
      box. That reads as a dead link — attached to the one message where you are
      asking someone to trust you enough to sign up.

      Static and site-wide, which is correct while the landing page is the only
      public surface. Per-route tags come with prerendering (roadmap 2.12), and
      belong with it: a per-route og:title is worthless if the crawler still
      sees an empty root.

      og:image must be an ABSOLUTE url — scrapers do not resolve relative paths.
    -->
    <meta property="og:title" content="Kimbio — every group run in Columbia" />
    <meta property="og:description" content="The pace, the meeting spot, and who's going. One place." />
    <meta property="og:image" content="https://getkimbio.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kimbio — every group run in Columbia" />
    <meta property="og:url" content="https://getkimbio.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kimbio" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kimbio — every group run in Columbia" />
    <meta name="twitter:description" content="The pace, the meeting spot, and who's going. One place." />
    <meta name="twitter:image" content="https://getkimbio.com/og-image.png" />
    <meta name="description" content="The pace, the meeting spot, and who's going. Every group run in Columbia, MO — one place." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kimbio" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
